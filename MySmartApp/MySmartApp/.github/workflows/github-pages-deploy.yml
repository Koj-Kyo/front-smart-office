name: Deploy to GitHub Pages

on:
  push:
    branches:
      - ui-wasm-only
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Blazor WASM
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore MySmartApp.Ui/MySmartApp.Ui.csproj

      - name: Build
        run: dotnet build MySmartApp.Ui/MySmartApp.Ui.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish MySmartApp.Ui/MySmartApp.Ui.csproj -c Release -o ./publish

      - name: Change base-tag in index.html
        run: |
          sed -i 's|<base href="/" />|<base href="/front-smart-office/" />|g' ./publish/wwwroot/index.html

      - name: Add .nojekyll file
        run: touch ./publish/wwwroot/.nojekyll

      - name: Copy index.html to 404.html
        run: cp ./publish/wwwroot/index.html ./publish/wwwroot/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

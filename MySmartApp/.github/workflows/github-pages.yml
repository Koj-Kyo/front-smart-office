name: Deploy to GitHub Pages

# Ce workflow est désactivé par défaut
# Renommez le fichier en supprimant .disabled pour l'activer

on:
  push:
    branches:
      - ui-wasm-only
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ?? Checkout
        uses: actions/checkout@v4

      - name: ?? Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: ?? Restore dependencies
        working-directory: ./MySmartApp.Ui
        run: dotnet restore

      - name: ??? Build
        working-directory: ./MySmartApp.Ui
        run: dotnet build --configuration Release --no-restore

      - name: ?? Publish
        working-directory: ./MySmartApp.Ui
        run: dotnet publish --configuration Release --output ./output

      - name: ?? Configure base path
        working-directory: ./MySmartApp.Ui/output/wwwroot
        run: |
          sed -i 's/<base href="\/" \/>/<base href="\/front-smart-office\/" \/>/g' index.html

      - name: ?? Add .nojekyll file
        run: touch ./MySmartApp.Ui/output/wwwroot/.nojekyll

      - name: ?? Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './MySmartApp.Ui/output/wwwroot'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: ?? Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

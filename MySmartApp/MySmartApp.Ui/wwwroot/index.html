<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MySmartApp UI</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div style="position:absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
            <div style="margin-bottom: 20px;">
                <svg width="50" height="50" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#6B46C1" stroke-width="2"/>
                    <path d="M14 8l-4 4 4 4" stroke="#6B46C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div style="color: #6B46C1; font-family: 'Roboto', sans-serif;">Chargement de l'application...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Une erreur inattendue s'est produite.
        <a href="." class="reload">Recharger</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/error-handler.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
